# mackup 0.11 in COPY mode only (`mackup backup` / `mackup restore`, never
# `link`). Driven by bin/dotfiles-apps, which passes this file with -c and
# rewrites [storage] path to the real local staging directory. mackup refuses
# a config or a path outside $HOME, so the path is relative to it.
#
# This is an allowlist. An empty [applications_to_sync] makes mackup back up
# EVERY supported app, so dotfiles-apps refuses to run without entries.
# Paths the dotfiles stow or link (zsh, git, ssh, Starship, mise, Karabiner,
# VS Code, Claude, Codex) must never appear here: `dotfiles apps check`
# enforces it. Overlap with a macos/defaults*.sh domain is allowed and
# reported; `dotfiles configure --defaults` re-applies those keys after a
# restore.
# See docs/agents/app-settings.md.
[storage]
engine = file_system
path = .local/state/dotfiles/mackup/stage
directory = Mackup

[applications_to_sync]
adobe-camera-raw
apple-music
aws-settings
bambu-studio
bartender
blender
claude-usage
cleanmymac-setapp
cleanshot
codexbar
daisydisk
fish
flux
