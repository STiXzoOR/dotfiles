# Settings, key bindings and save states only. The built-in openemu entry
# copies all of Application Support/OpenEmu, including ~400 MB of cores and
# the game library.
[application]
name = OpenEmu (settings)

[configuration_files]
Library/Preferences/org.openemu.OpenEmu.plist
Library/Application Support/OpenEmu/Bindings
Library/Application Support/OpenEmu/Save States
