# The preferences plist only: theme, appearance, Remote Control, the tailnet
# switch and the host list. Application Support/rex holds this Mac's host id
# and tailnet node, and a copy would make both Macs one Rex host.
# ~/.config/rex/init.lua is stowed from config/rex.
[application]
name = Rex (settings)

[configuration_files]
Library/Preferences/com.superlogical.rex.plist
