# Adobe Illustrator 29 (the installed version; the version is part of every
# path, so update it with the app). mackup's built-in covers only versions
# 17-24 and Application Support/Adobe/OOBE, which holds onboarding and account
# state and must never be restored: it can break Adobe sign-in.
[application]
name = Adobe Illustrator (settings)

[configuration_files]
Library/Preferences/com.adobe.illustrator.plist
Library/Preferences/Adobe Illustrator 29 Settings
Library/Application Support/Adobe/Adobe Illustrator 29
