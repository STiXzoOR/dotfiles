# Adobe Photoshop 2025 (the installed version; the version is part of the
# paths, so update it with the app). mackup's built-in covers only CC 2013-2019.
# Application Support/Adobe/OOBE is deliberately absent: it holds account state.
[application]
name = Adobe Photoshop (settings)

[configuration_files]
Library/Preferences/com.adobe.Photoshop.plist
Library/Preferences/Adobe Photoshop 2025 Settings
Library/Application Support/Adobe/Adobe Photoshop 2025
