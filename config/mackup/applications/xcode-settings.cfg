# Everything mackup's built-in xcode entry covers except FontAndColorThemes,
# where the dotfiles symlink the Nord theme (apps/xcode): a backup refuses
# symlinks.
[application]
name = Xcode (settings)

[configuration_files]
Library/Preferences/com.apple.dt.Xcode.plist
Library/Developer/Xcode/UserData/KeyBindings
Library/Developer/Xcode/UserData/CodeSnippets
Library/Developer/Xcode/UserData/SearchScopes.xcsclist
Library/Developer/Xcode/UserData/xcdebugger
Library/Developer/Xcode/UserData/Debugger
Library/Developer/Xcode/Templates
Library/Application Support/Developer/Shared/Xcode/Plug-ins
