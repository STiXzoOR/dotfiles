# Defined but NOT in the allowlist: Shottr is sandboxed, so on a machine
# where it is the App Store build the plist lives in
# ~/Library/Containers/cc.ffitch.shottr, which mackup cannot read without a
# TCC prompt. Add it to [applications_to_sync] only after checking that this
# path exists on the machine.
[application]
name = Shottr

[configuration_files]
Library/Preferences/cc.ffitch.shottr.plist
