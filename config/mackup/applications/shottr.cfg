# Shottr: the App Store build is sandboxed, so its plist lives in the
# container (readable without a prompt from an interactive shell). The
# non-sandboxed build keeps it in Preferences; mackup skips whichever is absent.
[application]
name = Shottr

[configuration_files]
Library/Containers/cc.ffitch.shottr/Data/Library/Preferences/cc.ffitch.shottr.plist
Library/Preferences/cc.ffitch.shottr.plist
