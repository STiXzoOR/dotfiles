# Installed by `dotfiles configure --remote-access` as
# /etc/ssh/sshd_config.d/010-dotfiles.conf. It sorts before macOS's
# 100-macos.conf on purpose: sshd keeps the first value it reads for a keyword.

# Keys only. No passwords and no keyboard-interactive (macOS sends password
# logins through PAM that way). No root.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PermitEmptyPasswords no

# Ed25519 and P-256 only; P-256 is what a phone's Secure Enclave makes.
PubkeyAcceptedAlgorithms ssh-ed25519,sk-ssh-ed25519@openssh.com,ecdsa-sha2-nistp256,sk-ecdsa-sha2-nistp256@openssh.com

MaxAuthTries 3
LoginGraceTime 20

# A session is a shell: no port, socket, agent or X11 forwarding, no tunnels.
DisableForwarding yes
PermitTunnel no
PermitUserEnvironment no
