# Pinned actions still have to be updated, or the pin becomes a stale
# vulnerable version. Dependabot opens that PR; a human reviews the diff.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    labels: ["dependencies"]

  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(submodules)"
    labels: ["dependencies"]
