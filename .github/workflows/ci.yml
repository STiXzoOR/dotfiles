name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      # Discover by shebang rather than a hardcoded list: the old glob
      # `scripts/*.sh` never matched scripts/lib/, and new bin/ tools were
      # invisible until someone remembered to add them here.
      - name: Run shellcheck on every bash script
        run: |
          set -euo pipefail
          mapfile -t files < <(
            git ls-files | while IFS= read -r f; do
              [ -f "$f" ] || continue
              head -1 "$f" | grep -qE '^#!.*bash' && echo "$f"
            done
          )
          printf 'linting %d bash files\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          shellcheck -e SC1090,SC1091,SC2034,SC2119,SC2154 -s bash "${files[@]}"

      - name: Check bash syntax
        run: |
          set -euo pipefail
          git ls-files | while IFS= read -r f; do
            [ -f "$f" ] || continue
            head -1 "$f" | grep -qE '^#!.*bash' || continue
            bash -n "$f"
          done

  syntax:
    name: Validate Zsh Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install zsh
        run: sudo apt-get install -y zsh

      - name: Check zsh syntax
        run: |
          # Shebang-derived, plus the extensionless zsh fragments that
          # runcom/ and system/ hold. The old hand-written list included
          # system/.fix, which does not exist -- guarded by [[ -f ]], so it
          # skipped silently and nobody noticed the gap.
          mapfile -t files < <(
            git ls-files 'runcom/*' 'system/*' 'bin/*' | while IFS= read -r f; do
              [ -f "$f" ] || continue
              if head -1 "$f" | grep -q zsh; then echo "$f"
              elif [ -z "$(head -1 "$f" | grep '^#!')" ]; then
                case "$f" in runcom/.*|system/.*) echo "$f" ;; esac
              fi
            done
          )

          printf 'checking %d zsh files\n' "${#files[@]}"
          for file in "${files[@]}"; do
            echo "Checking $file..."
            zsh -n "$file" || exit 1
          done

  test:
    name: Run Tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@cced187498280712e078aaba62dc13a3e9cd80bf

      - name: Install dependencies
        run: |
          brew install shellcheck coreutils

      - name: Run test suite
        run: |
          chmod +x bin/dotfiles-test
          ./bin/dotfiles-test --quick

      - name: Run audit regression suite
        run: ./tests/audit-regressions.sh
        env:
          DOTFILES_DIR: ${{ github.workspace }}

  brewfile:
    name: Validate Brewfile
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@cced187498280712e078aaba62dc13a3e9cd80bf

      - name: Validate Brewfile syntax
        run: |
          # Just check that the Brewfile is valid syntax
          brew bundle check --file=Brewfile 2>&1 || true
          # The check will "fail" because packages aren't installed
          # but syntax errors would cause a different error
          brew bundle list --file=Brewfile > /dev/null
